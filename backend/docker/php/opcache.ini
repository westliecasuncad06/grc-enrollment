; Cache compiled PHP code only; private API data and rate limits are unchanged.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=96
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
; Pick up file changes without requiring a manual cache reset.
opcache.validate_timestamps=1
opcache.revalidate_freq=2
; Avoid allocating a JIT buffer on the memory-limited host.
opcache.jit=0
opcache.jit_buffer_size=0
