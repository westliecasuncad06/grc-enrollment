        - message
      properties:
        code:
          type: string
          enum:
            - eligible
            - completed
            - already_selected
            - prerequisite
            - prerequisite_advisory
            - no_sections_available
            - block_restricted
          description: >
            Machine-checkable category. `prerequisite_advisory` and
            `block_restricted` reflect PRD §17 decisions pending formal GRC
            approval — see App\Domain\Academic\PrerequisiteEvaluator and
            App\Actions\Enrollment\BuildEligibleSubjectPool.
        message:
          type: string
    PaginatedEnrollmentCollection:
      type: object
      additionalProperties: false
