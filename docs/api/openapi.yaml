                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/eligible-subjects:
    get:
      operationId: getEligibleSubjects
      summary: Build the authenticated student's eligible-subject pool
      description: >
        Own-record only — Student role only, resolved against the caller's
        own StudentProfile. Every subject in the caller's curriculum is
        returned, whether currently selectable or not, each with an
        explainable `reasons` list (FR-ENR-005): `completed`,
        `already_selected`, `prerequisite`, `prerequisite_advisory` (the
        grading policy is not yet confirmed — see PRD §17), `no_sections_available`,
        `block_restricted`, or `eligible`. Cross-subject schedule-conflict
        exclusion is applied at submission time, not here — see the
        enrollment submission endpoint.
      security:
        - bearerAuth: []
      tags:
        - Enrollment
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: academic_term_id
          in: query
          required: true
          description: The term to build the pool against.
          schema:
            type: integer
      responses:
        "200":
          description: The authenticated student's eligible-subject pool.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibleSubjectCollectionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The authenticated user has no student profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: academic_term_id is missing or does not exist.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/enrollments:
    get:
      operationId: getEnrollments
      summary: List enrollments (role-scoped)
      description: >
        Role-scoped per FR-FIN-001/005 (see App\Models\Enrollment::scopeVisibleTo):
        a Student sees only their own enrollments; the Registrar Head sees
        every enrollment (the approval queue), filterable by `status` and
        `academic_term_id` and paginated; Accounting Staff sees only
        `pending_payment` enrollments regardless of any `status` filter
        supplied — that restriction is an authorization boundary
        (`EnrollmentPolicy`), not merely a display filter.
      security:
        - bearerAuth: []
      tags:
        - Enrollment
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - pending_registrar_approval
              - pending_payment
              - enrolled
              - rejected
              - cancelled
              - withdrawn
        - name: academic_term_id
          in: query
          required: false
          description: Existing academic term primary key.
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          description: Number of enrollments per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          required: false
          description: One-based page number.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: The role-scoped, paginated enrollment list.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedEnrollmentCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: A query parameter failed validation.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createEnrollment
      summary: Submit an enrollment (DFD 2.4)
      description: >
        Own-record only — Student role only. Atomically creates one
        enrollment, its enrollment subjects, one queue ticket, one audit
        entry, and a confirmation notification (FR-ENR-007–009). Every
        submitted section is re-validated server-side against a freshly
        built eligible-subject pool — the client's pool view is advisory
        only. Rejects a duplicate active enrollment for the term, a
        duplicate subject across two sections, sections that conflict on
        schedule with each other, and (only when
        `enrollment.max_regular_units` is configured — PRD §17 pending) a
        total load over the configured cap.
      security:
        - bearerAuth: []
      tags:
        - Enrollment
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreEnrollmentRequest"
      responses:
        "201":
          description: The created enrollment.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            Validation failed — a duplicate active enrollment, an ineligible,
            duplicate-subject, or schedule-conflicting section, or (when
            configured) an overload.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/enrollments/{enrollment}:
    patch:
      operationId: patchEnrollment
      summary: Apply one Registrar Head decision to an enrollment
      description: >
        No `role:` middleware gates this route — `registrar_approve` and
        `registrar_reject` (the approval-queue checkpoint) and `void` (a
        later, distinct checkpoint: cancelling an already-approved but unpaid
        enrollment) are each resolved by EnrollmentPolicy per request (see
        ADR 0011). `reason` is required exactly for `registrar_reject` and
        `void` (FR-FIN-002) and is recorded only in the audit row, since
        `enrollments` has no `decision_reason` column of its own.
      security:
        - bearerAuth: []
      tags:
        - Enrollment
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: enrollment
          in: path
          required: true
          description: Enrollment ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnrollmentRequest"
      responses:
        "200":
          description: The transition was applied.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No enrollment exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, the action does not match the
            enrollment's current status, or a required reason is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/enrollments/{enrollment}/payment:
    post:
      operationId: postEnrollmentPayment
      summary: Confirm an externally received payment and generate the Digital COM
      description: >
        Accounting Staff only, and only from `pending_payment`
        (FR-FIN-007/008). One transaction: a `Payment` row, the enrollment's
        own transition to `enrolled`, and the Digital COM
        (`EnrollmentDocument`, type `com`). Idempotent (FR-FIN-009): a
        repeat call — even one arriving after the enrollment has already
        moved on to `enrolled` — returns the existing payment and document
        rather than erroring or duplicating either, and receives `200`
        instead of `201`. No PDF pipeline: `document_number` is an opaque
        deterministic string and `storage_path` stays null; FR-FIN-010's
        print/download is served by the Student module rendering the
        structured response as a print-stylesheet page.
      security:
        - bearerAuth: []
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: enrollment
          in: path
          required: true
          description: Enrollment ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPaymentRequest"
      responses:
        "200":
          description: >
            An already-confirmed payment — the existing payment and
            document are returned unchanged (idempotent repeat call).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfirmationResponse"
        "201":
          description: The payment was confirmed and the Digital COM generated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentConfirmationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No enrollment exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, or the enrollment is not
            currently `pending_payment` and has no existing payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/enrollments/{enrollment}/withdraw:
    post:
      operationId: postEnrollmentWithdraw
      summary: Request withdrawal from an enrolled enrollment
      description: >
        Student only, and only for their own enrollment currently `enrolled`
        (FR-FIN-004, PRD §4.2 rule 7). Creates a `pending` withdrawal
        request; `reason` is required. Rejects a second pending request
        against the same enrollment. Does not touch the enrollment or
        release any seat — that happens only once Registrar Staff approves
        the request (see `PATCH /api/v1/withdrawal-requests/{withdrawalRequest}`).
        No `role:` middleware — `EnrollmentPolicy::withdraw` resolves the
        instance-level ownership check.
      security:
        - bearerAuth: []
      tags:
        - Withdrawals
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: enrollment
          in: path
          required: true
          description: Enrollment ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWithdrawalRequestRequest"
      responses:
        "201":
          description: The withdrawal request was created, with status pending.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No enrollment exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, the enrollment is not currently
            `enrolled`, or a withdrawal request is already pending for it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/withdrawal-requests:
    get:
      operationId: getWithdrawalRequests
      summary: List withdrawal requests (role-scoped)
      description: >
        Role-scoped per PRD §3.8 (see
