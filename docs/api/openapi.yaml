      properties:
        action:
          type: string
          enum:
            - registrar_approve
            - registrar_reject
            - void
        reason:
          type: ["string", "null"]
          description: Required exactly when action is registrar_reject or void.
        overload_acknowledged:
          type: boolean
          description: >
            Required true when action is registrar_approve AND the target
            enrollment's own requires_overload_approval is true (FR-ENR-004).
            Ignored otherwise.
