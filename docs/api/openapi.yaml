  /api/v1/sections:
    get:
      operationId: getSections
      summary: List sections visible to the authenticated role
      description: >
        Faculty receives only its own `published`/`closed` sections, matched
        by the assigned `professor_id`. Executive Director receives only
        `published` sections for the master schedule. Student and Accounting
        receive all `published`/`closed` sections; remaining planning roles
        receive every section regardless of status.
        Ordered by term, then subject, then section code.
      security:
        - bearerAuth: []
      tags:
        - Section Planning
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The sections visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postSection
      summary: Create a section
      description: >
        Program Chair only. Rejected (FR-SCH-005, ADR 0010) if the assigned
        professor would be double-booked against another section in the same
        term with an overlapping day and time.
      security:
        - bearerAuth: []
      tags:
        - Section Planning
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreSectionRequest"
      responses:
        "201":
          description: The section was created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            The submitted data is invalid, the section code is already used
            for this subject and term, or the assigned professor would be
            double-booked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/sections/{section}:
    patch:
      operationId: patchSection
