openapi: 3.1.0
info:
  title: GRC Automated Enrollment API
  version: 0.1.0
  license:
    name: License pending authorized GRC approval
    identifier: LicenseRef-GRC-Pending
  description: >
    Public, versioned Laravel API for the GRC Automated Enrollment System.
    Documents the database-independent health contract and the Sanctum
    bearer-token identity foundation. Later endpoint groups must be added as
    their complete vertical slices ship.
servers:
  - url: /
    description: Deployment-relative Laravel API origin
tags:
  - name: System
    description: Database-independent service liveness
  - name: Auth
    description: >
      Sanctum bearer-token authentication. Session cookies, CSRF-cookie
      endpoints, and `withCredentials` are never used.
  - name: Organization
    description: >
      Programs and academic terms. Readable by every role; the row set
      returned differs for learner-scoped roles (student, faculty, accounting
      staff) versus planning roles — see ADR 0008. Status vocabularies are
      provisional pending PRD §17 approval.
  - name: Curriculum
    description: >
      Subjects and curricula. Reads follow the same role-differentiated
      visibility as Organization; writes to curricula are restricted to the
      Program Chair role — see ADR 0009. Status vocabularies are provisional
      pending PRD §17 approval.
  - name: Faculty Input
    description: >
      Faculty-declared availability and ranked subject preferences
      (FR-SCH-003). Own-record authorization, not status-based: a Faculty
      member may read and write only their own rows (`role:faculty` at the
      route, re-checked by Policy); every other role reads every professor's
      rows, since planning a schedule needs the full picture.
  - name: Section Planning
    description: >
      Sections (FR-SCH-004) with professor double-booking conflict detection
      (FR-SCH-005, see ADR 0010). Reads follow the same role-differentiated
      visibility as Curriculum; writes are restricted to the Program Chair
      role. Status vocabulary is provisional pending PRD §17 approval;
      `viability_threshold` is informational only.
  - name: Approval Workflow
    description: >
      Schedule proposals (FR-SCH-007 through FR-SCH-009): the five-state
      lifecycle draft → dean_approved → executive_approved → published →
      closed. One `action` field drives six transitions, each requiring a
      different role — see ADR 0011. `publish` also bulk-transitions the
      term's `planned` sections to `published`.
  - name: Student Records
    description: >
      Student account provisioning and self-service profile reads (PRD §5.2,
      DFD 2.1). Admission Staff provisions the User and StudentProfile
      together in one transaction (§3.2); a student may read only their own
      profile, with no broader role-based visibility. `admission_status` and
      `academic_standing` vocabularies are provisional pending PRD §17
      approval.
  - name: Enrollment
    description: >
      Process 2.0's eligible-subject pool and submission (PRD §5.2, DFD 2.2)
      plus Process 3.0's approval queue (PRD §5.3, FR-FIN-001/002). The
      eligible-subject pool is own-record only; every entry carries an
      explainable reason (FR-ENR-005), and the official grading policy
      behind prerequisite checks is a PRD §17 decision still pending formal
      GRC approval — see App\Domain\Academic\PrerequisiteEvaluator. Reading
      and deciding enrollments is role-scoped (Student own, Registrar Head
      all, Accounting Staff pending_payment only) via
      App\Models\Enrollment::scopeVisibleTo and EnrollmentPolicy.
  - name: Withdrawals
    description: >
      Student-initiated withdrawal requests (FR-FIN-004, PRD §4.2 rule 7):
      a Student requests withdrawal from an `enrolled` enrollment; Registrar
      Staff approves or rejects the request (PRD §3.8's literal role
      assignment — the Registrar Head reads every request but does not
      decide one). Approval drops every still-active enrolled subject and
      — only when `config('enrollment.withdrawal.releases_seats')` is true
      (default; §17-pending) — releases each affected section's seat
      exactly once, even under a repeated approval attempt.
  - name: Transferee Credits
    description: >
      Registrar Staff records, edits, and decides credited external
      subjects (FR-FIN-003, PRD §3.8/§10.3); the Registrar Head and the
      owning Student read only. Every write is audited, including plain
      content edits, so the record and its control history cannot diverge.
      Approved credits are record-only — cross-institution grade
      equivalence is an open PRD §17 decision, so they are never read by
      `BuildEligibleSubjectPool`.
  - name: Class Rosters
    description: >
      The enrolled-student roster per section (PRD §3.2 "View assigned
      teaching schedules and class rosters"). Faculty sees only sections
      they are assigned to teach; Registrar Staff and Registrar Head see
      every section, the same keeper-of-the-record visibility they have
      elsewhere.
  - name: Academic Records
    description: >
      Grade encoding (PRD §4.3, §5.3 DFD 3.1): draft → submitted → locked.
      A Faculty member writes only for sections they are assigned to teach
      and may edit only while a grade is draft; the Registrar Head locks a
      submitted grade, the moment it becomes part of the official record
      `BuildEligibleSubjectPool` reads for prerequisite evaluation. Reads
      are role-scoped: Student own, Faculty own sections, Registrar Head
      and Registrar Staff all (PRD §3.8, widened in Phase 7b). `final_grade`
      carries no scale or passing-mark assertion — PRD §17 leaves the
      official grading scale an open decision.
  - name: Payments
    description: >
      The payment queue (PRD §5.3 FR-FIN-006), payment confirmation
      (FR-FIN-007/008), and the generated Digital COM (FR-FIN-009/010).
      Queue transitions are Accounting Staff only — gated by both
      `role:accounting_staff` and QueueTicketPolicy, since neither
      transition has a per-ticket ownership dimension the way
      enrollment/grade transitions do; §17 leaves reset cadence, priority,
      and how many tickets may be `serving` at once unconfirmed, so only
      the two-step order (`waiting` → `serving` → `served`) is enforced.
      Payment confirmation is idempotent and generates no PDF — the COM is
      structured data a Student, the Registrar Head, or Registrar Staff
      (PRD §3.8, widened in Phase 7b) renders as a print-stylesheet page.
  - name: Notifications
    description: >
      Private, user-owned in-app notifications. Every authenticated role may
      list only its own notifications and may mark only its own notification
      as read; the owning user ID is never exposed.
  - name: Audit
    description: >
      Immutable operational audit history. Only the Registrar Head may read
      this endpoint, and every successful list view is itself audited.
paths:
  /api/v1/health:
    get:
      operationId: getApiHealth
      summary: Read API liveness
      description: Returns no database, environment, dependency, credential, or user details.
      security: []
      tags:
        - System
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The API process is healthy.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  value:
                    data:
                      type: service-health
                      service: grc-enrollment-api
                      status: ok
                      api_version: v1
                      generated_at: "2026-07-26T08:42:53Z"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: Authenticate and issue a bearer token
      description: >
        Returns one identical generic failure for an unknown email, a wrong
        password, and a disabled account, so the endpoint cannot be used to
        enumerate accounts. Throttled per submitted account and caller
        address.
      security: []
      tags:
        - Auth
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: The provided credentials are incorrect.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The submitted email or password failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the current bearer token
      description: >
        Revokes only the token presented on this request; the caller's other
        devices remain signed in.
      security:
        - bearerAuth: []
      tags:
        - Auth
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "204":
          description: The token was revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/me:
    get:
      operationId: getAuthMe
      summary: Read the authenticated identity
      security:
        - bearerAuth: []
      tags:
        - Auth
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The identity for the presented bearer token.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/programs:
    get:
      operationId: getPrograms
      summary: List programs visible to the authenticated role
      description: >
        Learner-scoped roles (student, faculty, accounting staff) receive
        only learner-visible programs; every other role receives the full
        catalog regardless of status. Ordered by code ascending.
      security:
        - bearerAuth: []
      tags:
        - Organization
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The programs visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/academic-terms:
    get:
      operationId: getAcademicTerms
      summary: List academic terms visible to the authenticated role
      description: >
        Learner-scoped roles (student, faculty, accounting staff) do not
        receive terms still in `planning`; every other role receives every
        term regardless of status. Ordered by school year descending, then
        semester.
      security:
        - bearerAuth: []
      tags:
        - Organization
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The academic terms visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicTermsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createAcademicTerm
      summary: Create the next school-year-and-semester record
      description: Registrar Head only. Creates a Draft term and four
        college workflow rows; only one non-archived term may exist.
      security:
        - bearerAuth: []
      tags:
        - Organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicTermCreateRequest"
      responses:
        "201":
          description: Draft academic term created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicTermResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/academic-terms/{academicTerm}:
    patch:
      operationId: transitionAcademicTerm
      summary: Open enrollment, close, or archive one semester
      description: >
        Registrar Head only. `open_enrollment` moves the term to
        semester_ongoing from draft or for_dean_approval, and requires at
        least one published schedule_proposal for the term (ADR 0018: "no
        date alone silently changes lifecycle status" — the enrollment
        window dates only take effect once this transition fires). Archive
        closes an ongoing semester as part of the same transaction and
        retains all records attached to it.
      security:
        - bearerAuth: []
      tags:
        - Organization
      parameters:
        - name: academicTerm
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action:
                  type: string
                  enum: [open_enrollment, close, archive]
      responses:
        "200":
          description: Updated academic term.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicTermResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/academic-terms/{academicTerm}/enrollment-windows:
    get:
      operationId: getEnrollmentWindows
      summary: Read the term's enrollment schedule and per-year-level availability
      description: >
        Readable by every role AcademicTermPolicy::view allows (a
        learner-scoped role only for a learner-visible term). Computes each
        year level's live open/closed state via EnrollmentWindowResolver —
        a year level with no saved academic_term_year_level_windows row
        falls back to the term-wide enrollment_opens_at/enrollment_closes_at
        rather than being lazily written on this read. `viewer` is populated
        only for an authenticated Student, for their own year level; null
        for every other role.
      security:
        - bearerAuth: []
      tags:
        - Organization
      parameters:
        - name: academicTerm
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The term's enrollment schedule.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentScheduleResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/academic-terms/{academicTerm}/enrollment-schedule:
    patch:
      operationId: updateEnrollmentSchedule
      summary: Save the term-wide and per-year-level enrollment windows
      description: >
        Registrar Head only. Replaces enrollment_opens_at/enrollment_closes_at
        on the term and upserts all four academic_term_year_level_windows
        rows in one request. Each year-level window must fall within the
        term-wide window and close after it opens.
      security:
        - bearerAuth: []
      tags:
        - Organization
      parameters:
        - name: academicTerm
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnrollmentScheduleRequest"
      responses:
        "200":
          description: The updated enrollment schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentScheduleResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/academic-term-workflows:
    get:
      operationId: getAcademicTermWorkflows
      summary: List college workflow stages for one academic term
      security:
        - bearerAuth: []
      tags:
        - Organization
      parameters:
        - name: academic_term_id
          in: query
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: College workflow stages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicTermWorkflowsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/academic-term-workflows/{workflow}:
    patch:
      operationId: transitionAcademicTermWorkflow
      summary: Advance one college's manual enrollment workflow
      security:
        - bearerAuth: []
      tags:
        - Organization
      parameters:
        - name: workflow
          in: path
          required: true
          schema:
            type: integer
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action]
              properties:
                action:
                  type: string
                  enum:
                    - start_curriculum_preparation
                    - complete_curriculum_preparation
                    - complete_faculty_input
      responses:
        "200":
          description: Updated college workflow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicTermWorkflowResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/v1/subjects:
    get:
      operationId: getSubjects
      summary: List subjects visible to the authenticated role
      description: >
        Learner-scoped roles (student, faculty, accounting staff) receive
        only learner-visible subjects; every other role receives the full
        catalog regardless of status. Ordered by code ascending.
      security:
        - bearerAuth: []
      tags:
        - Curriculum
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The subjects visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/curricula:
    get:
      operationId: getCurricula
      summary: List curricula visible to the authenticated role
      description: >
        Learner-scoped roles do not receive `draft` curricula; every other
        role receives every curriculum regardless of status. Each curriculum
        includes its full subject placement and prerequisite tree. Ordered by
        effective school year descending, then name.
      security:
        - bearerAuth: []
      tags:
        - Curriculum
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The curricula visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculaResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postCurricula
      summary: Create a curriculum with its subject placements and prerequisites
      description: >
        Program Chair only. The `subjects` array is the complete subject
        placement and prerequisite set for the curriculum — see ADR 0009. A
        submission whose prerequisites form a direct or transitive cycle is
        rejected (FR-SCH-002).
      security:
        - bearerAuth: []
      tags:
        - Curriculum
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCurriculumRequest"
      responses:
        "201":
          description: The curriculum was created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            The submitted data is invalid, or the submitted subjects contain
            a direct or transitive prerequisite cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/curricula/{curriculum}:
    patch:
      operationId: patchCurriculum
      summary: Replace a curriculum's fields and subject/prerequisite plan
      description: >
        Program Chair only. Full replace, not a partial update: the submitted
        `subjects` array becomes the curriculum's complete subject placement
        and prerequisite set — see ADR 0009.
      security:
        - bearerAuth: []
      tags:
        - Curriculum
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: curriculum
          in: path
          required: true
          description: Curriculum ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurriculumRequest"
      responses:
        "200":
          description: The curriculum was updated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No curriculum exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, or the submitted subjects contain
            a direct or transitive prerequisite cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/faculty-availabilities:
    get:
      operationId: getFacultyAvailabilities
      summary: List faculty availability visible to the authenticated role
      description: >
        A Faculty member receives only their own declared availability;
        every other role receives every professor's. Ordered by academic
        term, then day of week, then start time.
      security:
        - bearerAuth: []
      tags:
        - Faculty Input
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The faculty availability visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacultyAvailabilitiesResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postFacultyAvailability
      summary: Declare a recurring weekly availability window
      description: >
        Faculty only. `professor_id` is always the authenticated user — it
        is never accepted from the request body, so one professor cannot
        declare availability for another.
      security:
        - bearerAuth: []
      tags:
        - Faculty Input
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreFacultyAvailabilityRequest"
      responses:
        "201":
          description: The availability window was created.
          headers:
            X-Request-ID:
