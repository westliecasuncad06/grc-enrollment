        - bearerAuth: []
      tags:
        - Student Records
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The authenticated user's own student profile.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
