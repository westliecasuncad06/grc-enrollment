                $ref: "#/components/schemas/PaginatedWithdrawalRequestCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: A query parameter failed validation.
