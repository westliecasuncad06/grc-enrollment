            payment:
              type: object
              additionalProperties: false
              required:
                - external_reference
                - amount
                - confirmed_at
              properties:
                external_reference:
                  type: ["string", "null"]
                amount:
                  type: ["string", "null"]
                confirmed_at:
                  type: ["string", "null"]
                  format: date-time
            document:
              type: object
              additionalProperties: false
              required:
                - document_type
                - document_number
                - generated_at
              properties:
                document_type:
                  type: ["string", "null"]
                  enum:
                    - com
                    - null
                document_number:
                  type: ["string", "null"]
                generated_at:
                  type: ["string", "null"]
                  format: date-time
    PaginatedEnrollmentDocumentCollection:
      type: object
      additionalProperties: false
      required:
        - data
        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EnrollmentDocumentResource"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    EnrollmentDocumentResource:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - enrollment_id
        - student_number
        - document_type
        - document_type_label
        - document_number
        - generated_at
      properties:
        type:
          type: string
          const: enrollment_document
        id:
          type: integer
        enrollment_id:
          type: integer
        student_number:
          type: string
        document_type:
          type: string
          enum:
            - com
        document_type_label:
          type: string
        document_number:
          type: string
          description: Opaque — PRD §17 leaves COM numbering unconfirmed.
        generated_at:
          type: string
          format: date-time
    StoreSectionRequest:
      type: object
      additionalProperties: false
      required:
        - academic_term_id
        - subject_id
        - section_code
        - capacity
        - status
      properties:
        academic_term_id:
          type: integer
        subject_id:
          type: integer
        section_code:
          type: string
          maxLength: 255
        professor_id:
          type: ["integer", "null"]
        schedule_days:
          type: ["string", "null"]
          maxLength: 255
        starts_at_time:
          type: ["string", "null"]
          format: time
        ends_at_time:
          type: ["string", "null"]
          format: time
        room:
          type: ["string", "null"]
          maxLength: 255
        modality:
          type: ["string", "null"]
          enum: [online, hyflex_a, hyflex_b, f2f, null]
        capacity:
          type: integer
          minimum: 1
        viability_threshold:
          type: ["integer", "null"]
          minimum: 1
        status:
          type: string
          enum:
            - planned
            - published
            - closed
            - cancelled
    UpdateSectionRequest:
      $ref: "#/components/schemas/StoreSectionRequest"
    ScheduleProposalsResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleProposalResource"
    ScheduleProposalResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/ScheduleProposalResource"
    ScheduleProposalResource:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - academic_term_id
        - college
        - college_label
        - academic_term_label
        - section_plan_id
        - submitted_by
        - submitted_by_name
        - is_submitted
        - is_returned
        - returned_by_role
        - status
        - status_label
        - decided_by
        - decided_at
        - decision_reason
      properties:
        type:
          type: string
          const: schedule_proposal
        id:
          type: integer
        academic_term_id:
          type: integer
        college:
          type: ["string", "null"]
          enum: [ccs, coe, coa, cbae, null]
        college_label:
          type: ["string", "null"]
        academic_term_label:
          type: string
        section_plan_id:
          type: ["integer", "null"]
        submitted_by:
          type: integer
        submitted_by_name:
          type: string
        is_submitted:
          type: boolean
          description: False after a reviewer returns the proposal for Program Chair corrections.
        is_returned:
          type: boolean
          description: >
            Derived, not a stored status — true when status is draft,
            is_submitted is false, and decision_reason is not null. There is
            no dedicated "returned" status; dean_return/executive_return
            both resolve to draft (see ScheduleProposalTransitionRules).
        returned_by_role:
          type: ["string", "null"]
          enum: [dean, executive_director, null]
          description: The role of the last reviewer who returned this proposal, when is_returned is true.
        status:
          type: string
          description: >
            Authoritative PRD §4.1 lifecycle — see
            App\Domain\Scheduling\ScheduleProposalStatus.
          enum:
            - draft
            - dean_approved
            - executive_approved
            - published
            - closed
        status_label:
          type: string
        decided_by:
          type: ["integer", "null"]
        decided_at:
          type: ["string", "null"]
          format: date-time
        decision_reason:
          type: ["string", "null"]
    ScheduleReviewSectionsResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleReviewSectionResource"
    ScheduleReviewSectionResource:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - section_code
        - subject_code
        - subject_title
        - units
        - professor_id
        - professor_name
        - schedule_days
        - starts_at_time
        - ends_at_time
        - room
        - modality
      properties:
        type:
          type: string
          const: schedule_review_section
        id:
          type: integer
        section_code:
          type: string
        subject_code:
          type: string
        subject_title:
          type: string
        units:
          type: number
        professor_id:
          type: ["integer", "null"]
        professor_name:
          type: ["string", "null"]
        schedule_days:
          type: ["string", "null"]
        starts_at_time:
          type: ["string", "null"]
          format: time
        ends_at_time:
          type: ["string", "null"]
          format: time
        room:
          type: ["string", "null"]
        modality:
          type: ["string", "null"]
          enum: [online, hyflex_a, hyflex_b, f2f, null]
    StoreScheduleProposalRequest:
      type: object
      additionalProperties: false
      required:
        - academic_term_id
      properties:
        academic_term_id:
          type: integer
    UpdateScheduleProposalRequest:
      type: object
      additionalProperties: false
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - dean_approve
            - dean_return
            - executive_approve
            - executive_return
            - publish
            - close
        decision_reason:
          type: ["string", "null"]
          description: Required exactly when action is dean_return or executive_return.
    StudentProfileResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/StudentProfileResource"
    StudentProfileResource:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - user_id
        - student_number
        - program_id
        - curriculum_id
        - year_level
        - admission_status
        - admission_status_label
        - academic_standing
        - academic_standing_label
      properties:
        type:
          type: string
          const: student_profile
        id:
          type: integer
        user_id:
          type: integer
        student_number:
          type: string
        program_id:
          type: integer
        curriculum_id:
          type: integer
        year_level:
          type: integer
        admission_status:
          type: string
          description: >
            Provisional vocabulary pending PRD §17 approval — see
            App\Domain\Identity\AdmissionStatus.
          enum:
            - pending
            - admitted
            - enrolled
            - graduated
            - withdrawn
        admission_status_label:
          type: string
        academic_standing:
          type: string
          description: >
            Provisional vocabulary pending PRD §17 approval — see
            App\Domain\Identity\AcademicStanding.
          enum:
            - good
            - probation
            - warning
        academic_standing_label:
          type: string
        financial_status:
          type: [string, 'null']
          description: >
            Informational only, set at admission provisioning — never read by
            fee computation. See App\Domain\Identity\FinancialStatus.
          enum:
            - scholar
            - payee
            - null
        financial_status_label:
          type: [string, 'null']
    StoreStudentProfileRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
        - student_number
        - program_id
        - curriculum_id
        - year_level
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
        student_number:
          type: string
          maxLength: 255
          pattern: '^\d{4}-(0[1-9]|1[0-2])-\d{5}$'
          description: >
            YYYY-MM-NNNNN — the year and month provisioned, then a random
            5-digit suffix. The frontend generates this by default.
        program_id:
          type: integer
        curriculum_id:
          type: integer
          description: Must belong to the given program_id.
        year_level:
          type: integer
          minimum: 1
        financial_status:
          type: [string, 'null']
          enum:
            - scholar
            - payee
            - null
