          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/queue-tickets:
    get:
      operationId: getQueueTickets
      summary: List the payment queue
      description: >
        Accounting Staff only. Ordered deterministically by `queue_date`
        then `id` (arrival order) — PRD §17 leaves any reset or priority
        policy unconfirmed, so no ordering beyond plain arrival is asserted.
      security:
        - bearerAuth: []
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: queue_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - waiting
              - serving
              - served
              - cancelled
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: The paginated payment queue.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedQueueTicketCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: A query parameter failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/queue-tickets/{queueTicket}:
    patch:
      operationId: patchQueueTicket
      summary: Advance one ticket in the payment queue
      description: >
        Accounting Staff only. `action: serve` moves `waiting` → `serving`
        (and implicitly completes whatever else was `serving` that day —
        single-active-serving); `action: complete` moves `serving` →
        `served`; `action: skip` returns either `waiting` or `serving` to
        `waiting`, stamping a fresh `requeued_at` so the ticket moves to the
        back of its own priority tier instead of losing its place;
        `action: mark_priority` flags a `waiting` ticket `priority` without
        changing its status. §17 leaves reset cadence and priority
        eligibility unconfirmed.
      security:
        - bearerAuth: []
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: queueTicket
          in: path
          required: true
          description: Queue ticket ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQueueTicketRequest"
      responses:
        "200":
          description: The transition was applied.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueTicketResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No queue ticket exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The action does not match the ticket's current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/payments:
    get:
      operationId: getPayments
      summary: List confirmed payments
      description: >
        Accounting Staff's own payment history, plus Registrar Head
        oversight — no `role:` middleware, `PaymentPolicy` resolves both
        roles with no further per-row scoping. Reads `payments` directly
        rather than `Enrollment::scopeVisibleTo`, since a payment record
        must remain visible after ConfirmPayment moves the owning
        enrollment out of `pending_payment`. Ordered most recently
        confirmed first.
      security:
        - bearerAuth: []
      tags:
        - Payments
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: confirmed_on
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: The paginated payment history.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPaymentCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: A query parameter failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notifications:
    get:
      operationId: getNotifications
      summary: List the authenticated user's notifications
      description: >
        Returns only notifications owned by the authenticated user, newest
        first. The optional unread filter and pagination inputs are preserved
        in pagination links. Notification resources deliberately omit
        `user_id`.
      security:
        - bearerAuth: []
      tags:
        - Notifications
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: unread_only
          in: query
          required: false
          description: When true, return only notifications whose read_at is null.
          schema:
            type: boolean
            default: false
        - name: per_page
          in: query
          required: false
          description: Number of notifications per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          required: false
          description: One-based page number.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: The authenticated user's notifications.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedNotificationCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          description: A query parameter failed validation.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notifications/{notification}/read:
    patch:
      operationId: patchNotificationRead
      summary: Mark an owned notification as read
      description: >
        Sets read_at once and is idempotent: retrying preserves the original
        read timestamp. A different user's notification is forbidden without
        disclosing its content.
      security:
        - bearerAuth: []
      tags:
        - Notifications
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: notification
          in: path
          required: true
          description: Notification primary key.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The notification is marked as read.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No notification exists for the supplied primary key.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/audit-logs:
    get:
      operationId: getAuditLogs
      summary: List operational audit history
      description: >
        Registrar Head only. Results are ordered newest first and may be
        filtered by the exact audited action, entity type, actor, or inclusive
        UTC date bounds. Each successful view creates an
        `audit_log.list_viewed` record after the result query is built.
      security:
        - bearerAuth: []
      tags:
        - Audit
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum:
              - curriculum.created
              - curriculum.updated
              - faculty_availability.created
              - faculty_availability.updated
              - faculty_availability.deleted
              - faculty_subject_preference.created
              - faculty_subject_preference.updated
              - faculty_subject_preference.deleted
              - section.created
              - section.updated
              - schedule_proposal.created
              - schedule_proposal.dean_approved
              - schedule_proposal.dean_returned
              - schedule_proposal.executive_approved
              - schedule_proposal.executive_returned
              - schedule_proposal.published
              - section.published
              - schedule_proposal.closed
              - student_profile.provisioned
              - audit_log.list_viewed
              - faculty_directory.list_viewed
              - enrollment.submitted
              - enrollment.registrar_approved
              - enrollment.registrar_rejected
              - enrollment.voided
              - academic_grade.created
              - academic_grade.updated
              - academic_grade.submitted
              - academic_grade.locked
              - queue_ticket.serving_started
              - queue_ticket.served
              - enrollment.payment_confirmed
              - withdrawal_request.created
              - withdrawal_request.approved
              - withdrawal_request.rejected
              - transferee_credit.created
              - transferee_credit.updated
              - transferee_credit.approved
              - transferee_credit.rejected
        - name: auditable_type
          in: query
          required: false
          schema:
            type: string
            enum:
              - curriculum
              - faculty_availability
              - faculty_subject_preference
              - section
              - schedule_proposal
              - student_profile
              - audit_log
              - faculty_directory
              - enrollment
              - academic_grade
              - queue_ticket
              - withdrawal_request
              - transferee_credit
        - name: actor_user_id
          in: query
          required: false
          description: Existing user primary key.
          schema:
            type: integer
            minimum: 1
        - name: from
          in: query
          required: false
          description: Inclusive lower UTC calendar date.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Inclusive upper UTC calendar date; cannot precede from.
          schema:
            type: string
            format: date
        - name: per_page
          in: query
          required: false
          description: Number of audit records per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          required: false
          description: One-based page number.
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: Filtered operational audit history.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAuditLogCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: A query parameter failed validation.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: >
        Optional caller correlation ID containing 1–128 ASCII letters, digits,
        dots, underscores, or hyphens. Invalid values are replaced.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
        maxLength: 128
  headers:
    RequestId:
      description: The validated caller ID or a server-generated correlation ID.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
        maxLength: 128
    NoStore:
      description: The response contains a no-store cache directive.
      schema:
        type: string
        pattern: '(^|.*,\s*)no-store(\s*,.*|$)'
    NoStorePrivate:
      description: >
        The response contains no-store and private directives, since it may
        carry a bearer token or identity detail no shared cache may retain.
      schema:
        type: string
        pattern: '(^|.*,\s*)no-store(\s*,.*|$)'
  responses:
    Unauthenticated:
      description: A valid bearer token is required.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >
        The authenticated role is not authorized to perform this action.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: The request is invalid for the current lifecycle state.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: The caller has exceeded the applicable request rate.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          description: Seconds until the caller should retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: The API could not complete the request.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/HealthResource"
    HealthResource:
      type: object
      additionalProperties: false
      required:
        - type
        - service
        - status
        - api_version
        - generated_at
      properties:
        type:
          type: string
          const: service-health
        service:
          type: string
          const: grc-enrollment-api
        status:
          type: string
          const: ok
        api_version:
          type: string
          const: v1
        generated_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
    AuthResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AuthResource"
    AuthResource:
      type: object
      additionalProperties: false
      required:
        - type
        - token
        - token_type
        - expires_at
        - user
      properties:
        type:
          type: string
          const: auth-session
        token:
          type: string
          description: Plain-text bearer token. Shown only once, on this response.
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: >
            PROVISIONAL — derived from a local development default pending
            the PRD §17 approved token-expiration policy.
        user:
          $ref: "#/components/schemas/UserResource"
    UserResponse:
