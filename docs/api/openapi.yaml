openapi: 3.1.0
info:
  title: GRC Automated Enrollment API
  version: 0.1.0
  license:
    name: License pending authorized GRC approval
    identifier: LicenseRef-GRC-Pending
  description: >
    Public, versioned Laravel API for the GRC Automated Enrollment System.
    Documents the database-independent health contract and the Sanctum
    bearer-token identity foundation. Later endpoint groups must be added as
    their complete vertical slices ship.
servers:
  - url: /
    description: Deployment-relative Laravel API origin
tags:
  - name: System
    description: Database-independent service liveness
  - name: Auth
    description: >
      Sanctum bearer-token authentication. Session cookies, CSRF-cookie
      endpoints, and `withCredentials` are never used.
  - name: Organization
    description: >
      Programs and academic terms. Readable by every role; the row set
      returned differs for learner-scoped roles (student, faculty, accounting
      staff) versus planning roles — see ADR 0008. Status vocabularies are
      provisional pending PRD §17 approval.
paths:
  /api/v1/health:
    get:
      operationId: getApiHealth
      summary: Read API liveness
      description: Returns no database, environment, dependency, credential, or user details.
      security: []
      tags:
        - System
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The API process is healthy.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  value:
                    data:
                      type: service-health
                      service: grc-enrollment-api
                      status: ok
                      api_version: v1
                      generated_at: "2026-07-26T08:42:53Z"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: Authenticate and issue a bearer token
      description: >
        Returns one identical generic failure for an unknown email, a wrong
        password, and a disabled account, so the endpoint cannot be used to
        enumerate accounts. Throttled per submitted account and caller
        address.
      security: []
      tags:
        - Auth
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: The provided credentials are incorrect.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The submitted email or password failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the current bearer token
      description: >
        Revokes only the token presented on this request; the caller's other
        devices remain signed in.
      security:
        - bearerAuth: []
      tags:
        - Auth
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "204":
          description: The token was revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/me:
    get:
      operationId: getAuthMe
      summary: Read the authenticated identity
      security:
        - bearerAuth: []
      tags:
        - Auth
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The identity for the presented bearer token.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/programs:
    get:
      operationId: getPrograms
      summary: List programs visible to the authenticated role
      description: >
        Learner-scoped roles (student, faculty, accounting staff) receive
        only learner-visible programs; every other role receives the full
        catalog regardless of status. Ordered by code ascending.
      security:
        - bearerAuth: []
      tags:
        - Organization
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The programs visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/academic-terms:
    get:
      operationId: getAcademicTerms
      summary: List academic terms visible to the authenticated role
      description: >
        Learner-scoped roles (student, faculty, accounting staff) do not
        receive terms still in `planning`; every other role receives every
        term regardless of status. Ordered by school year descending, then
        semester.
      security:
        - bearerAuth: []
      tags:
        - Organization
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The academic terms visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicTermsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: >
        Optional caller correlation ID containing 1–128 ASCII letters, digits,
        dots, underscores, or hyphens. Invalid values are replaced.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
        maxLength: 128
  headers:
    RequestId:
      description: The validated caller ID or a server-generated correlation ID.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
        maxLength: 128
    NoStore:
      description: The response contains a no-store cache directive.
      schema:
        type: string
        pattern: '(^|.*,\s*)no-store(\s*,.*|$)'
    NoStorePrivate:
      description: >
        The response contains no-store and private directives, since it may
        carry a bearer token or identity detail no shared cache may retain.
      schema:
        type: string
        pattern: '(^|.*,\s*)no-store(\s*,.*|$)'
  responses:
    Unauthenticated:
      description: A valid bearer token is required.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: The caller has exceeded the applicable request rate.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          description: Seconds until the caller should retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: The API could not complete the request.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/HealthResource"
    HealthResource:
      type: object
      additionalProperties: false
      required:
        - type
        - service
        - status
        - api_version
        - generated_at
      properties:
        type:
          type: string
          const: service-health
        service:
          type: string
          const: grc-enrollment-api
        status:
          type: string
          const: ok
        api_version:
          type: string
          const: v1
        generated_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
    AuthResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AuthResource"
    AuthResource:
      type: object
      additionalProperties: false
      required:
        - type
        - token
        - token_type
        - expires_at
        - user
      properties:
        type:
          type: string
          const: auth-session
        token:
          type: string
          description: Plain-text bearer token. Shown only once, on this response.
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: >
            PROVISIONAL — derived from a local development default pending
            the PRD §17 approved token-expiration policy.
        user:
          $ref: "#/components/schemas/UserResource"
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/UserResource"
    UserResource:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - name
        - email
        - role
        - role_label
        - status
      properties:
        type:
          type: string
          const: user
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - student
            - admission_staff
            - faculty
            - program_chair
            - dean
            - executive_director
            - registrar_head
            - registrar_staff
            - accounting_staff
        role_label:
          type: string
        status:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - errors
        - request_id
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        request_id:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,128}$"
    ProgramsResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProgramResource"
    ProgramResource:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - code
        - name
        - status
        - status_label
      properties:
        type:
          type: string
          const: program
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        status:
          type: string
          description: >
            PROVISIONAL vocabulary pending PRD §17 approval — see
            App\Domain\Organization\ProgramStatus.
          enum:
            - active
            - inactive
        status_label:
          type: string
    AcademicTermsResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AcademicTermResource"
    AcademicTermResource:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - school_year
        - semester
        - starts_at
        - ends_at
        - enrollment_opens_at
        - enrollment_closes_at
        - status
        - status_label
      properties:
        type:
          type: string
          const: academic-term
        id:
          type: integer
        school_year:
          type: string
        semester:
          type: string
        starts_at:
          type: ["string", "null"]
          format: date-time
        ends_at:
          type: ["string", "null"]
          format: date-time
        enrollment_opens_at:
          type: ["string", "null"]
          format: date-time
        enrollment_closes_at:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          description: >
            PROVISIONAL vocabulary pending PRD §17 approval — see
            App\Domain\Organization\AcademicTermStatus.
          enum:
            - planning
            - active
            - closed
        status_label:
          type: string
