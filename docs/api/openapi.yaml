            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/withdrawal-requests/{withdrawalRequest}:
    patch:
      operationId: patchWithdrawalRequest
      summary: Approve or reject a pending withdrawal request
      description: >
        Registrar Staff only (PRD §3.8's literal role assignment; the
        Registrar Head reads every request but does not decide one). No
        `role:` middleware — WithdrawalRequestPolicy resolves the ability.
        `approve`, in one transaction: the request moves to `approved`; the
        enrollment moves to `withdrawn`; every still-active enrolled subject
        moves to `dropped`; and — only when
        `config('enrollment.withdrawal.releases_seats')` is true (default) —
        each affected section's `enrolled_count` is decremented exactly
        once, even under a repeated approval attempt. `reject` requires a
        reason, recorded only in the audit row.
      security:
        - bearerAuth: []
      tags:
        - Withdrawals
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: withdrawalRequest
          in: path
          required: true
          description: Withdrawal request ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWithdrawalRequestRequest"
      responses:
        "200":
          description: The decision was applied.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalRequestResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No withdrawal request exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, the request is no longer
            pending, or a required reason is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
