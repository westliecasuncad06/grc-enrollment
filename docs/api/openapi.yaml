  /api/v1/academic-grades:
    get:
      operationId: getAcademicGrades
      summary: List academic grades (role-scoped)
      description: >
        Role-scoped per DFD 3.1 (see App\Models\AcademicGrade::scopeVisibleTo):
        a Student sees only their own grade records; Faculty sees only
        grades tied to a section they are assigned to teach; the Registrar
        Head and Registrar Staff (PRD §3.8, widened in Phase 7b) see every
        grade, as keepers of the official academic record.
      security:
        - bearerAuth: []
      tags:
        - Academic Records
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: student_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: subject_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: academic_term_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - submitted
              - locked
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: The role-scoped, paginated grade list.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAcademicGradeCollection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: A query parameter failed validation.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postAcademicGrade
      summary: Create a draft grade record
      description: >
        Faculty only, and only for one of the encoding professor's own
        sections (re-checked server-side even though the client should
        already know its own roster). Always created with status draft.
        Rejects a duplicate (student, subject, term) combination.
      security:
        - bearerAuth: []
      tags:
        - Academic Records
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreAcademicGradeRequest"
      responses:
        "201":
          description: The created draft grade record.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicGradeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            Validation failed — the section is not assigned to the caller,
            or a grade record already exists for this student, subject, and
            term.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/academic-grades/{academicGrade}:
    patch:
      operationId: patchAcademicGrade
      summary: Edit a draft grade, or apply a submit/lock transition
      description: >
        No `role:` middleware gates this route — AcademicGradePolicy
        resolves the right ability per request (ADR 0011). With no `action`,
        this is a plain content edit of `final_grade`/`remarks` by the
        encoding Faculty member, allowed only while the grade is still
        draft. `action: submit` (Faculty, draft → submitted) or
        `action: lock` (Registrar Head, submitted → locked) is a pure
        status transition; content fields are prohibited on those requests.
      security:
        - bearerAuth: []
      tags:
        - Academic Records
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: academicGrade
          in: path
          required: true
          description: Academic grade ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAcademicGradeRequest"
      responses:
        "200":
          description: The edit or transition was applied.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicGradeResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No academic grade exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, the grade is no longer editable,
            or the action does not match the grade's current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/class-rosters:
    get:
      operationId: getClassRosters
      summary: List the class roster (role-scoped)
      description: >
        PRD §3.2 "View assigned teaching schedules and class rosters"; PRD
        §3.8 keeper-of-the-record read access. See
        App\Models\EnrollmentSubject::scopeVisibleTo: Faculty sees only
        sections they are assigned to teach; Registrar Staff and Registrar
        Head see every section. No Student-facing use case exists for this
        endpoint.
      security:
