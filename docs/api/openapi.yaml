openapi: 3.1.0
info:
  title: GRC Automated Enrollment API
  version: 0.1.0
  license:
    name: License pending authorized GRC approval
    identifier: LicenseRef-GRC-Pending
  description: >
    Public, versioned Laravel API for the GRC Automated Enrollment System.
    Documents the database-independent health contract and the Sanctum
    bearer-token identity foundation. Later endpoint groups must be added as
    their complete vertical slices ship.
servers:
  - url: /
    description: Deployment-relative Laravel API origin
tags:
  - name: System
    description: Database-independent service liveness
  - name: Auth
    description: >
      Sanctum bearer-token authentication. Session cookies, CSRF-cookie
      endpoints, and `withCredentials` are never used.
  - name: Organization
    description: >
      Programs and academic terms. Readable by every role; the row set
      returned differs for learner-scoped roles (student, faculty, accounting
      staff) versus planning roles — see ADR 0008. Status vocabularies are
      provisional pending PRD §17 approval.
  - name: Curriculum
    description: >
      Subjects and curricula. Reads follow the same role-differentiated
      visibility as Organization; writes to curricula are restricted to the
      Program Chair role — see ADR 0009. Status vocabularies are provisional
      pending PRD §17 approval.
  - name: Faculty Input
    description: >
      Faculty-declared availability and ranked subject preferences
      (FR-SCH-003). Own-record authorization, not status-based: a Faculty
      member may read and write only their own rows (`role:faculty` at the
      route, re-checked by Policy); every other role reads every professor's
      rows, since planning a schedule needs the full picture.
  - name: Section Planning
    description: >
      Sections (FR-SCH-004) with professor double-booking conflict detection
      (FR-SCH-005, see ADR 0010). Reads follow the same role-differentiated
      visibility as Curriculum; writes are restricted to the Program Chair
      role. Status vocabulary is provisional pending PRD §17 approval;
      `viability_threshold` is informational only.
paths:
  /api/v1/health:
    get:
      operationId: getApiHealth
      summary: Read API liveness
      description: Returns no database, environment, dependency, credential, or user details.
      security: []
      tags:
        - System
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The API process is healthy.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  value:
                    data:
                      type: service-health
                      service: grc-enrollment-api
                      status: ok
                      api_version: v1
                      generated_at: "2026-07-26T08:42:53Z"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: Authenticate and issue a bearer token
      description: >
        Returns one identical generic failure for an unknown email, a wrong
        password, and a disabled account, so the endpoint cannot be used to
        enumerate accounts. Throttled per submitted account and caller
        address.
      security: []
      tags:
        - Auth
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication succeeded.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: The provided credentials are incorrect.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The submitted email or password failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke the current bearer token
      description: >
        Revokes only the token presented on this request; the caller's other
        devices remain signed in.
      security:
        - bearerAuth: []
      tags:
        - Auth
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "204":
          description: The token was revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/me:
    get:
      operationId: getAuthMe
      summary: Read the authenticated identity
      security:
        - bearerAuth: []
      tags:
        - Auth
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The identity for the presented bearer token.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/programs:
    get:
      operationId: getPrograms
      summary: List programs visible to the authenticated role
      description: >
        Learner-scoped roles (student, faculty, accounting staff) receive
        only learner-visible programs; every other role receives the full
        catalog regardless of status. Ordered by code ascending.
      security:
        - bearerAuth: []
      tags:
        - Organization
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The programs visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgramsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/academic-terms:
    get:
      operationId: getAcademicTerms
      summary: List academic terms visible to the authenticated role
      description: >
        Learner-scoped roles (student, faculty, accounting staff) do not
        receive terms still in `planning`; every other role receives every
        term regardless of status. Ordered by school year descending, then
        semester.
      security:
        - bearerAuth: []
      tags:
        - Organization
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The academic terms visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicTermsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/subjects:
    get:
      operationId: getSubjects
      summary: List subjects visible to the authenticated role
      description: >
        Learner-scoped roles (student, faculty, accounting staff) receive
        only learner-visible subjects; every other role receives the full
        catalog regardless of status. Ordered by code ascending.
      security:
        - bearerAuth: []
      tags:
        - Curriculum
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The subjects visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/curricula:
    get:
      operationId: getCurricula
      summary: List curricula visible to the authenticated role
      description: >
        Learner-scoped roles do not receive `draft` curricula; every other
        role receives every curriculum regardless of status. Each curriculum
        includes its full subject placement and prerequisite tree. Ordered by
        effective school year descending, then name.
      security:
        - bearerAuth: []
      tags:
        - Curriculum
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The curricula visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculaResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postCurricula
      summary: Create a curriculum with its subject placements and prerequisites
      description: >
        Program Chair only. The `subjects` array is the complete subject
        placement and prerequisite set for the curriculum — see ADR 0009. A
        submission whose prerequisites form a direct or transitive cycle is
        rejected (FR-SCH-002).
      security:
        - bearerAuth: []
      tags:
        - Curriculum
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreCurriculumRequest"
      responses:
        "201":
          description: The curriculum was created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            The submitted data is invalid, or the submitted subjects contain
            a direct or transitive prerequisite cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/curricula/{curriculum}:
    patch:
      operationId: patchCurriculum
      summary: Replace a curriculum's fields and subject/prerequisite plan
      description: >
        Program Chair only. Full replace, not a partial update: the submitted
        `subjects` array becomes the curriculum's complete subject placement
        and prerequisite set — see ADR 0009.
      security:
        - bearerAuth: []
      tags:
        - Curriculum
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: curriculum
          in: path
          required: true
          description: Curriculum ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurriculumRequest"
      responses:
        "200":
          description: The curriculum was updated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No curriculum exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, or the submitted subjects contain
            a direct or transitive prerequisite cycle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/faculty-availabilities:
    get:
      operationId: getFacultyAvailabilities
      summary: List faculty availability visible to the authenticated role
      description: >
        A Faculty member receives only their own declared availability;
        every other role receives every professor's. Ordered by academic
        term, then day of week, then start time.
      security:
        - bearerAuth: []
      tags:
        - Faculty Input
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The faculty availability visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacultyAvailabilitiesResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postFacultyAvailability
      summary: Declare a recurring weekly availability window
      description: >
        Faculty only. `professor_id` is always the authenticated user — it
        is never accepted from the request body, so one professor cannot
        declare availability for another.
      security:
        - bearerAuth: []
      tags:
        - Faculty Input
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreFacultyAvailabilityRequest"
      responses:
        "201":
          description: The availability window was created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacultyAvailabilityResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            The submitted data is invalid, or the professor already declared
            this exact day/start-time slot for this term.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/faculty-availabilities/{facultyAvailability}:
    patch:
      operationId: patchFacultyAvailability
      summary: Replace an availability window's fields
      description: Faculty only, and only the professor who owns the row.
      security:
        - bearerAuth: []
      tags:
        - Faculty Input
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: facultyAvailability
          in: path
          required: true
          description: Faculty availability ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFacultyAvailabilityRequest"
      responses:
        "200":
          description: The availability window was updated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacultyAvailabilityResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No availability window exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, or conflicts with another slot
            this professor already declared for this term.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteFacultyAvailability
      summary: Remove an availability window
      description: Faculty only, and only the professor who owns the row.
      security:
        - bearerAuth: []
      tags:
        - Faculty Input
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: facultyAvailability
          in: path
          required: true
          description: Faculty availability ID.
          schema:
            type: integer
      responses:
        "204":
          description: The availability window was removed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No availability window exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/faculty-subject-preferences:
    get:
      operationId: getFacultySubjectPreferences
      summary: List ranked subject preferences visible to the authenticated role
      description: >
        A Faculty member receives only their own preferences; every other
        role receives every professor's. Ordered by academic term, then rank.
      security:
        - bearerAuth: []
      tags:
        - Faculty Input
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The subject preferences visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacultySubjectPreferencesResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postFacultySubjectPreference
      summary: Rank a subject for a term
      description: >
        Faculty only. `professor_id` is always the authenticated user. A
        professor may not rank the same subject twice, or reuse a rank
        position, within one term.
      security:
        - bearerAuth: []
      tags:
        - Faculty Input
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreFacultySubjectPreferenceRequest"
      responses:
        "201":
          description: The preference was created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacultySubjectPreferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            The submitted data is invalid, the subject is already ranked by
            this professor for this term, or the rank is already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/faculty-subject-preferences/{facultySubjectPreference}:
    patch:
      operationId: patchFacultySubjectPreference
      summary: Replace a subject preference's fields
      description: Faculty only, and only the professor who owns the row.
      security:
        - bearerAuth: []
      tags:
        - Faculty Input
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: facultySubjectPreference
          in: path
          required: true
          description: Faculty subject preference ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFacultySubjectPreferenceRequest"
      responses:
        "200":
          description: The preference was updated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacultySubjectPreferenceResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No preference exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, or conflicts with another
            preference this professor already declared for this term.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteFacultySubjectPreference
      summary: Remove a subject preference
      description: Faculty only, and only the professor who owns the row.
      security:
        - bearerAuth: []
      tags:
        - Faculty Input
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: facultySubjectPreference
          in: path
          required: true
          description: Faculty subject preference ID.
          schema:
            type: integer
      responses:
        "204":
          description: The preference was removed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No preference exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/sections:
    get:
      operationId: getSections
      summary: List sections visible to the authenticated role
      description: >
        Learner-scoped roles receive only `published`/`closed` sections;
        every other role receives every section regardless of status.
        Ordered by term, then subject, then section code.
      security:
        - bearerAuth: []
      tags:
        - Section Planning
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The sections visible to the authenticated role.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionsResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: postSection
      summary: Create a section
      description: >
        Program Chair only. Rejected (FR-SCH-005, ADR 0010) if the assigned
        professor would be double-booked against another section in the same
        term with an overlapping day and time.
      security:
        - bearerAuth: []
      tags:
        - Section Planning
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreSectionRequest"
      responses:
        "201":
          description: The section was created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >
            The submitted data is invalid, the section code is already used
            for this subject and term, or the assigned professor would be
            double-booked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/sections/{section}:
    patch:
      operationId: patchSection
      summary: Replace a section's fields
      description: Program Chair only. Full replace, not a partial update.
      security:
        - bearerAuth: []
      tags:
        - Section Planning
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: section
          in: path
          required: true
          description: Section ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSectionRequest"
      responses:
        "200":
          description: The section was updated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No section exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, the section code is already used
            for this subject and term, or the assigned professor would be
            double-booked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: >
        Optional caller correlation ID containing 1–128 ASCII letters, digits,
        dots, underscores, or hyphens. Invalid values are replaced.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
        maxLength: 128
  headers:
    RequestId:
      description: The validated caller ID or a server-generated correlation ID.
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,128}$"
        maxLength: 128
    NoStore:
      description: The response contains a no-store cache directive.
      schema:
        type: string
        pattern: '(^|.*,\s*)no-store(\s*,.*|$)'
    NoStorePrivate:
      description: >
        The response contains no-store and private directives, since it may
        carry a bearer token or identity detail no shared cache may retain.
      schema:
        type: string
        pattern: '(^|.*,\s*)no-store(\s*,.*|$)'
  responses:
    Unauthenticated:
      description: A valid bearer token is required.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: >
        The authenticated role is not authorized to perform this action.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: The caller has exceeded the applicable request rate.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          description: Seconds until the caller should retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: The API could not complete the request.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/HealthResource"
    HealthResource:
      type: object
      additionalProperties: false
      required:
        - type
        - service
        - status
        - api_version
        - generated_at
      properties:
        type:
          type: string
          const: service-health
        service:
          type: string
          const: grc-enrollment-api
        status:
          type: string
          const: ok
        api_version:
          type: string
          const: v1
        generated_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
    AuthResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/AuthResource"
    AuthResource:
      type: object
      additionalProperties: false
      required:
        - type
        - token
        - token_type
        - expires_at
        - user
      properties:
        type:
          type: string
          const: auth-session
        token:
          type: string
          description: Plain-text bearer token. Shown only once, on this response.
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: ["string", "null"]
          format: date-time
          description: >
            PROVISIONAL — derived from a local development default pending
            the PRD §17 approved token-expiration policy.
        user:
          $ref: "#/components/schemas/UserResource"
    UserResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/UserResource"
    UserResource:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - name
        - email
        - role
        - role_label
        - status
      properties:
        type:
          type: string
          const: user
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - student
            - admission_staff
            - faculty
            - program_chair
            - dean
            - executive_director
            - registrar_head
            - registrar_staff
            - accounting_staff
        role_label:
          type: string
        status:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
    ApiError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - errors
        - request_id
      properties:
        code:
          type: string
          pattern: "^[A-Z0-9_]+$"
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
