      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/EnrollmentResource"
    EnrollmentResource:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - student_id
        - student_number
        - student_financial_status
        - student_financial_status_label
        - academic_term_id
        - status
        - status_label
        - total_units
        - requires_overload_approval
        - submitted_at
        - registrar_decided_at
        - payment_confirmed_at
        - enrolled_at
        - subjects
        - queue_ticket
        - assessment
      properties:
        type:
          type: string
          const: enrollment
        id:
          type: integer
        student_id:
          type: integer
        student_number:
          type: string
          description: >
            Never email or name — exposed so the Registrar Head and
            Accounting Staff can identify whose enrollment they are
            processing.
        student_financial_status:
          type: [string, 'null']
          description: >
            Informational only — never read by fee computation. See
            App\Domain\Identity\FinancialStatus.
          enum:
            - scholar
            - payee
            - null
        student_financial_status_label:
          type: [string, 'null']
        academic_term_id:
          type: integer
        status:
          type: string
          description: >
            PRD §4.2's authoritative lifecycle — see
            App\Domain\Enrollment\EnrollmentStatus.
          enum:
            - draft
            - pending_registrar_approval
            - pending_payment
            - enrolled
            - rejected
            - cancelled
            - withdrawn
        status_label:
          type: string
        total_units:
          type: number
          format: float
        requires_overload_approval:
          type: boolean
          description: >
            FR-ENR-004. True when the submission exceeded
            config('enrollment.max_regular_units') but stayed within
            config('enrollment.overload_max_units'). registrar_approve is
            rejected on a flagged enrollment unless the request also sends
            overload_acknowledged: true.
        submitted_at:
          type: ["string", "null"]
          format: date-time
        registrar_decided_at:
          type: ["string", "null"]
          format: date-time
        payment_confirmed_at:
          type: ["string", "null"]
          format: date-time
        enrolled_at:
          type: ["string", "null"]
          format: date-time
        subjects:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - section_id
              - subject_code
              - subject_title
              - status
              - status_label
            properties:
              section_id:
                type: integer
              subject_code:
                type: string
              subject_title:
                type: string
              status:
                type: string
                enum:
                  - selected
                  - enrolled
                  - dropped
              status_label:
                type: string
        queue_ticket:
          type: ["object", "null"]
          additionalProperties: false
          required:
            - ticket_number
            - queue_date
            - status
            - status_label
            - priority
            - priority_label
            - position
          properties:
            ticket_number:
              type: string
              description: >
                Resets daily (Q001, Q002, ...) — PRD §17 leaves the exact
                numbering scheme unconfirmed.
            queue_date:
              type: string
              format: date
            status:
              type: string
              enum:
                - waiting
                - serving
                - served
                - cancelled
            status_label:
              type: string
            priority:
              type: string
              enum:
                - regular
                - priority
            priority_label:
              type: string
            position:
              type: ["integer", "null"]
              description: >
                How many other waiting tickets stand ahead of this one
                today. Null once the ticket has left waiting. Never the
                full queue — only the holder's own count, for privacy.
        assessment:
          type: ["object", "null"]
          additionalProperties: false
          description: >
            PRD §5.3 process 3.3 "computes the approved assessment" —
            null for any enrollment that has never reached
            registrar_approve. See App\Actions\Billing\AssessEnrollment.
            Every value here is provisional per PRD §17; see
            config/fees.php.
          required:
            - total_amount
            - currency
            - assessed_at
            - items
          properties:
            total_amount:
              type: ["string", "null"]
              description: >
                Decimal string, never a float — money must not go
                through binary floating point.
            currency:
              type: string
            assessed_at:
              type: string
              format: date-time
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                  - category
                  - category_label
                  - label
                  - quantity
                  - unit_amount
                  - amount
                properties:
                  category:
                    type: string
                    enum:
                      - tuition
                      - miscellaneous
                  category_label:
                    type: string
                  label:
                    type: string
                  quantity:
                    type: ["string", "null"]
                    description: Units, for the tuition line only.
                  unit_amount:
                    type: ["string", "null"]
                    description: Per-unit rate, for the tuition line only.
                  amount:
                    type: ["string", "null"]
    StoreEnrollmentRequest:
      type: object
      additionalProperties: false
      required:
        - academic_term_id
        - sections
      properties:
        academic_term_id:
          type: integer
        sections:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - section_id
