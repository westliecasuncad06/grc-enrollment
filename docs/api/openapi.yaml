        - links
        - meta
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EnrollmentResource"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
