        request_id:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,128}$"
    ProgramsResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProgramResource"
    ProgramResource:
