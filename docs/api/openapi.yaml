      tags:
        - Section Planning
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - name: section
          in: path
          required: true
          description: Section ID.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSectionRequest"
      responses:
        "200":
          description: The section was updated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStorePrivate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No section exists with the given ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            The submitted data is invalid, the section code is already used
            for this subject and term, or the assigned professor would be
            double-booked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/schedule-proposals:
    get:
      operationId: getScheduleProposals
      summary: List schedule proposals visible to the authenticated role
      description: >
        Learner-scoped roles receive only `published`/`closed` proposals;
        every other role receives every proposal regardless of status.
        Ordered by term descending, then most recently created first.
      security:
        - bearerAuth: []
      tags:
        - Approval Workflow
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The schedule proposals visible to the authenticated role.
          headers:
