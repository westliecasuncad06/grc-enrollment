name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_DATABASE: grc_enrollment_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, ctype, curl, dom, fileinfo, json, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # Ephemeral, per-run MariaDB service container — not the least-privilege
      # grc_app/grc_migrator/grc_test split used on the shared local dev
      # instance. There is nothing long-lived here to protect, so a single
      # root-equivalent user is used for both connections. See ADR 0012.
      - name: Configure environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          APP_KEY_LINE=$(grep '^APP_KEY=' .env)

          cp .env.testing.example .env.testing
          sed -i "s#^APP_KEY=.*#${APP_KEY_LINE}#" .env.testing

          for f in .env .env.testing; do
            sed -i \
              -e "s/^DB_HOST=.*/DB_HOST=127.0.0.1/" \
              -e "s/^DB_PORT=.*/DB_PORT=3306/" \
              -e "s/^DB_USERNAME=.*/DB_USERNAME=root/" \
              -e "s/^DB_PASSWORD=.*/DB_PASSWORD=ci_root_password/" \
              "$f"
          done

          sed -i \
            -e "s/^DB_MIGRATOR_USERNAME=.*/DB_MIGRATOR_USERNAME=root/" \
            -e "s/^DB_MIGRATOR_PASSWORD=.*/DB_MIGRATOR_PASSWORD=ci_root_password/" \
            .env
          {
            echo "DB_MIGRATOR_USERNAME=root"
            echo "DB_MIGRATOR_PASSWORD=ci_root_password"
          } >> .env.testing

      - name: Format check (Pint)
        run: composer format:check

      - name: Static analysis (Larastan)
        run: composer analyse

      - name: Run tests
        run: composer test

      - name: Dependency audit
        run: composer audit --locked

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Lint (Oxlint, fast)
        run: npm run lint:fast

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=moderate

  ml-service:
    name: ML Service (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: ml-service/requirements.lock

      # requirements.lock is a complete, fully-pinned freeze of the verified
      # environment (runtime + dev tools) — installing it instead of
      # requirements-dev.txt removes drift risk from unpinned transitive
      # dependencies resolving to whatever is newest on PyPI at CI run time.
      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Static analysis (mypy)
        run: mypy app

      - name: Tests
        run: pytest

      - name: Dependency integrity
        run: pip check

      # Isolated via pipx so the audit tool's own dependencies never mix with
      # this project's pinned set, matching local practice.
      - name: Dependency audit
        run: pipx run pip-audit==2.10.1 -r requirements.lock

  docs:
    name: OpenAPI Document
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Lint OpenAPI document
        run: npx --yes @redocly/cli@latest lint docs/api/openapi.yaml
